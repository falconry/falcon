# Test source distribution and pure-Python wheel.
name: test-dist

on:
  push:
    branches:
      - "*"

jobs:
  test-dist:
    name: test-${{ matrix.build }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - sdist
          - wheel

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build dist
        env:
          FALCON_DISABLE_CYTHON: "Y"
        run: |
          pip install --upgrade pip
          pip install --upgrade build
          python -m build --${{ matrix.build }}

      - name: Test sdist
        if: matrix.build == 'sdist'
        run: |
          tools/check_dist.py
          tools/test_dist.py dist/*.tar.gz

      - name: Test pure-Python wheel
        if: matrix.build == 'wheel'
        run: |
          tools/check_dist.py
          tools/test_dist.py dist/*.whl
