# Other tests, primarily those requiring obsolete dependencies.
name: test-other

on:
  push:
    branches:
      - "*"

jobs:
  run-tox:
    name: tox -e ${{ matrix.tox.env }}
    permissions:
      contents: read
    runs-on: ${{ matrix.tox.os }}
    strategy:
      fail-fast: false
      matrix:
        tox:
          - env: "py310_smoke"
            os: ubuntu-latest
            python-version: "3.10"
          - env: "py310_smoke_cython"
            os: ubuntu-latest
            python-version: "3.10"
          - env: "wsgi_meinheld"
            os: ubuntu-24.04
            python-version: "3.9"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.tox.python-version }}

      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools tox wheel
          python --version
          pip --version
          tox --version

      - name: Run tox
        run: tox -e ${{ matrix.tox.env }}
