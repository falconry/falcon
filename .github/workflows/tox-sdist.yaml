name: test-tox-sdist

on:
  # Trigger the workflow on master but also allow it to run manually.
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  run_tox:
    name: tox (python${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version != '3.15' && matrix.python-version || '3.15.0-rc.2 - 3.15.0'}}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools tox wheel
          python --version
          pip --version
          tox --version

      - name: Adjust .coveragerc
        run: |
          tools/sed_coverage_rc.py

      - name: Run tox inside sdist
        run: |
          tools/tox_sdist.py
